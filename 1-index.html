<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6efe6">
<title>FALCOM | بطاقة تعريف المندوب</title>
<link rel="icon" href="favicon.png"><link rel="apple-touch-icon" href="favicon.png">
<style>
:root{--tan:#b79066;--tan-d:#8d6a47;--tan-l:#e9dac6;--brown:#3a2a1a;--muted:#6f6254;--line:#eadfce}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--brown);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;line-height:1.5;background:radial-gradient(circle at 50% 30%,#fdfbf8,#f3eadf 80%)}
.deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.deco svg{position:absolute}
.deco .tl{top:0;left:0;width:min(560px,85vw);height:auto}.deco .bt{bottom:0;left:0;width:100%;height:80px}
.page{position:relative;z-index:1;width:100%;min-height:100vh;min-height:100svh;padding:max(14px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:1.6svh}
#content{display:contents}
.lang{align-self:flex-end;display:flex;direction:ltr;border:1px solid #cfdbe9;background:#fff;border-radius:24px;padding:3px;box-shadow:0 2px 8px #3a2a1a14;grid-area:lang;justify-self:end}
.lang button{border:0;background:none;border-radius:20px;padding:8px 20px;font:700 15px/1.2 inherit;font-family:inherit;color:#2f6db0;cursor:pointer}
.lang button.on{background:var(--tan);color:#fff}
.logo{grid-area:logo;flex:1.9 1 auto;min-height:118px;background:#fff;border-radius:34px;padding:14px 20px;display:grid;place-items:center;box-shadow:0 8px 26px #3a2a1a16;border:1px solid var(--line)}
.logo img{width:auto;max-width:100%;height:clamp(90px,17svh,180px);object-fit:contain;display:block}
.rep{grid-area:rep;flex:2 1 auto;min-height:130px;display:flex;align-items:center;gap:18px}
.avatar{height:min(38vw,21svh);width:min(38vw,21svh);min-width:104px;min-height:104px;flex:none;border-radius:8vw;background:var(--tan-l);border:6px solid #fff;box-shadow:0 8px 22px #3a2a1a26;overflow:hidden}
.avatar svg,.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.who{flex:1;min-width:0}
h1{margin:0;font-size:clamp(32px,10.4vw,48px);line-height:1.15;font-weight:800}
.role{margin-top:8px;font-size:clamp(18px,5.4vw,24px);font-weight:700;color:var(--tan);line-height:1.35}
.who hr{border:0;height:2px;background:var(--tan);opacity:.7;margin:14px 0 0}
.actions{grid-area:actions;flex:1.2 1 auto;min-height:104px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.btn{overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border-radius:22px;text-decoration:none;font:800 clamp(15px,4.5vw,19px)/1.2 inherit;font-family:inherit;cursor:pointer;text-align:center;padding:10px 6px;border:2px solid transparent;box-shadow:0 8px 18px #3a2a1a1c}
.btn svg{width:clamp(34px,10vw,46px);height:clamp(34px,10vw,46px)}
.call{background:linear-gradient(160deg,#c49d72,#a47c52);color:#fff}
.wa{background:#fff;color:#1f5fa8;border-color:#2f6db0}
.save{background:#f6ecde;color:var(--tan-d);border-color:var(--tan)}
.about{grid-area:about;flex:1.8 1 auto;min-height:176px;display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:28px;padding:16px 18px;box-shadow:0 6px 20px #3a2a1a12}
.about img{width:clamp(80px,24vw,130px);flex:none;opacity:.28}
.about .t{display:flex;align-items:center;gap:10px;font-weight:800;font-size:clamp(19px,5.4vw,24px)}
.about .t i{width:30px;height:30px;border-radius:50%;background:var(--tan);color:#fff;display:grid;place-items:center;font:700 17px/1 serif;font-style:normal}
.about p{margin:10px 0 0;font-size:clamp(14px,3.9vw,18px);line-height:1.75;border-inline-start:2px solid var(--tan);padding-inline-start:14px}
.bar{grid-area:bar;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#c29b70,#9f7850);color:#fff;border-radius:34px;padding:clamp(12px,2svh,20px) 4px;box-shadow:0 8px 18px #3a2a1a26}
.bar a,.bar>span{display:flex;align-items:center;gap:6px;padding:2px 9px;color:#fff;text-decoration:none;font-weight:700;font-size:clamp(12px,3.4vw,17px);white-space:nowrap}
.bar>*+*{border-inline-start:1px solid #ffffff66}
.bar svg{width:20px;height:20px;flex:none}
.notfound{display:none;text-align:center;padding:50px 10px}.notfound h2{margin:0 0 8px}.notfound p{margin:0;color:var(--muted)}
html[lang=en] h1{font-size:clamp(28px,8.2vw,44px)}html[lang=en] .role{font-size:clamp(16px,4.6vw,22px)}html[lang=en] .about p{font-size:clamp(13.5px,3.7vw,17px)}
@media(min-width:760px){html[lang=en] h1{font-size:clamp(40px,4.6vw,72px)}html[lang=en] .role{font-size:clamp(20px,2vw,30px)}html[lang=en] .about p{font-size:clamp(16px,1.35vw,21px)}
 .page{display:grid;height:100vh;min-height:620px;padding:28px 5vw 32px;gap:26px 3.5vw;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr auto auto auto;grid-template-areas:"lang lang" "logo rep" "logo actions" "logo about" "bar bar"}
 .logo{padding:3vw;border-radius:44px}.logo img{height:auto;max-height:100%;width:100%}
 .rep{flex-direction:row;gap:2.4vw;align-self:center}
 .avatar{width:clamp(150px,15vw,240px);height:clamp(150px,15vw,240px);border-radius:36px}
 h1{font-size:clamp(40px,4.6vw,72px)}.role{font-size:clamp(20px,2vw,30px)}
 .actions{min-height:150px}.btn{font-size:clamp(17px,1.5vw,22px);border-radius:28px}.btn svg{width:clamp(40px,3.4vw,56px);height:clamp(40px,3.4vw,56px)}
 .about{padding:2vw 2.4vw;border-radius:36px}.about p{font-size:clamp(16px,1.35vw,21px)}.about .t{font-size:clamp(20px,1.7vw,28px)}.about img{width:clamp(100px,9vw,170px)}
 .bar{border-radius:36px}.bar a,.bar>span{font-size:clamp(15px,1.4vw,22px);padding:2px 1.6vw}
}
</style></head><body>
<div class="deco"><svg class="tl" viewBox="0 0 400 220" aria-hidden="true"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#b79066"/><stop offset="1" stop-color="#e9dac6"/></linearGradient></defs><path d="M0 0H330C260 40 190 20 120 90C80 130 40 170 0 200Z" fill="url(#g)" opacity=".5"/><path d="M0 0H250C190 30 130 20 80 70C50 100 25 130 0 150Z" fill="#b79066" opacity=".75"/><path d="M0 0H140C100 20 60 30 0 80Z" fill="#8d6a47" opacity=".6"/></svg>
<svg class="bt" viewBox="0 0 400 70" preserveAspectRatio="none" aria-hidden="true"><path d="M0 70V40C100 10 200 60 400 20V70Z" fill="#b79066" opacity=".35"/><path d="M0 70V55C120 30 240 70 400 40V70Z" fill="#b79066" opacity=".6"/></svg></div>
<div class="page">
<div class="lang" id="langSw"><button id="bEn" type="button" onclick="setLang(true)">English</button><button id="bAr" type="button" class="on" onclick="setLang(false)">عربي</button></div>
<div class="logo"><img src="falcom-logo-h.png" alt="FALCOM فالكوم"></div>
<div id="content">
<section class="rep"><div class="avatar" id="avatar"></div><div class="who"><h1 id="name"></h1><div class="role" id="role"></div><hr></div></section>
<section class="actions">
<a class="btn call" id="call" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg><span id="callT"></span></a>
<a class="btn wa" id="wa" href="#"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.2 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.3 0 .5l-.3.5-.4.4c-.1.2-.3.3-.1.6.2.3.7 1.2 1.5 1.9 1 .9 1.9 1.2 2.2 1.3.3.1.4.1.6-.1l.8-1c.2-.3.4-.2.6-.1l2 1c.3.1.5.2.5.3.1.2.1.8-.1 1.3z"/></svg><span id="waT"></span></a>
<button class="btn save" id="save" type="button" onclick="downloadVcard()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="11" r="2.4"/><path d="M5.5 17c.6-2 2-3 3.5-3s2.9 1 3.5 3M14.5 9.5h4M14.5 13h4"/></svg><span id="saveT"></span></button>
</section>
<section class="about"><img src="mark.png" alt=""><div><div class="t"><i>i</i><span id="aboutT"></span></div><p id="aboutP"></p></div></section>
<div class="bar"><a id="phoneBar" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg><bdi dir="ltr" id="phone"></bdi></a><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg><span id="region"></span></span></div>
</div>
<div class="notfound" id="notfound"><h2 id="nfTitle"></h2><p id="nfBody"></p></div>
</div>
<script>
const reps={"FLC-001":{name:"محمد رضا",en:"Mohamed Reda",role:"مندوب مصنع أسفلت",roleEn:"Asphalt Plant Sales Representative",phone:"+966 59 757 8219",tel:"+966597578219",wa:"966597578219",region:"المملكة العربية السعودية",regionEn:"Saudi Arabia"}};
const $=i=>document.getElementById(i);
const params=new URLSearchParams(location.search);
let id=(params.get("id")||"FLC-001").toUpperCase();let rep=reps[id];
const notFound=!rep&&!!params.get("id");if(!rep){id="FLC-001";rep=reps[id]}
let english=params.get("lang")==="en";
const T={ar:{call:"اتصال",wa:"واتساب",save:"حفظ جهة الاتصال",aboutT:"عن الشركة",aboutP:"فالكوم (FALCOM) شركة متخصصة في إنتاج الأسفلت وتنفيذ أعمال الطرق والبنية التحتية وفق أعلى معايير الجودة.",nfT:"هذه البطاقة غير موجودة",nfB:"الرابط أو الكود غير صحيح. تأكد منه أو تواصل مع الشركة."},
en:{call:"Call",wa:"WhatsApp",save:"Save contact",aboutT:"About the company",aboutP:"FALCOM is a company specialized in asphalt production and road and infrastructure works, to the highest quality standards.",nfT:"Card not found",nfB:"The link or code is not valid. Please check it or contact the company."}};
const AV='<svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" fill="#efdfcd"/><circle cx="32" cy="24" r="11" fill="#a47c52"/><path d="M9 64c0-14 9-21 23-21s23 7 23 21z" fill="#a47c52"/></svg>';
function setAvatar(el){el.innerHTML=AV;const im=new Image();im.alt="";im.onload=()=>{el.innerHTML="";el.appendChild(im)};im.src="photos/"+id+".jpg"}
function setLang(e){english=e;render()}
function render(){const t=english?T.en:T.ar,h=document.documentElement;h.lang=english?"en":"ar";h.dir=english?"ltr":"rtl";
$("bEn").classList.toggle("on",english);$("bAr").classList.toggle("on",!english);
if(notFound){$("content").style.display="none";$("notfound").style.display="block";$("nfTitle").textContent=t.nfT;$("nfBody").textContent=t.nfB;return}
$("name").textContent=english?rep.en:rep.name;setAvatar($("avatar"));$("role").textContent=english?rep.roleEn:rep.role;
$("callT").textContent=t.call;$("waT").textContent=t.wa;$("saveT").textContent=t.save;$("aboutT").textContent=t.aboutT;$("aboutP").textContent=t.aboutP;
$("phone").textContent=rep.phone;$("phoneBar").href="tel:"+rep.tel;$("call").href="tel:"+rep.tel;
$("wa").href="https://wa.me/"+rep.wa;$("wa").target="_blank";$("wa").rel="noopener";
$("region").textContent=english?rep.regionEn:rep.region}
function downloadVcard(){const v=["BEGIN:VCARD","VERSION:3.0","FN:"+rep.en,"ORG:FALCOM","TITLE:"+rep.roleEn,"TEL;TYPE=CELL:"+rep.tel,"ADR:;;"+rep.regionEn+";;;;","END:VCARD"].join("\r\n");const b=new Blob([v],{type:"text/vcard;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="FALCOM-"+id+".vcf";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
render();
</script></body></html>
