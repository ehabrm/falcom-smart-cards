<style>
:root{--tan:#b79066;--tan-d:#8d6a47;--tan-l:#e9dac6;--brown:#3a2a1a;--muted:#6f6254;--line:#eadfce}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{margin:0;min-height:100vh;min-height:100svh;overscroll-behavior:none;color:var(--brown);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;line-height:1.5;background:radial-gradient(circle at 50% 30%,#fdfbf8,#f3eadf 80%)}
.deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.deco svg{position:absolute}
.deco .tl{top:0;left:0;width:min(560px,85vw);height:auto}.deco .bt{bottom:0;left:0;width:100%;height:80px}
.page{position:relative;z-index:1;width:100%;min-height:100vh;min-height:100svh;padding:max(14px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:1.6svh}
#content{display:contents}
.lang{align-self:flex-end;display:flex;direction:ltr;border:1px solid #cfdbe9;background:#fff;border-radius:24px;padding:3px;box-shadow:0 2px 8px #3a2a1a14;grid-area:lang;justify-self:end}
.lang button{border:0;background:none;border-radius:20px;padding:8px 20px;font:700 15px/1.2 inherit;font-family:inherit;color:#2f6db0;cursor:pointer}
.lang button.on{background:var(--tan);color:#fff}
.logo{grid-area:logo;flex:1.9 1 auto;min-height:118px;background:#fff;border-radius:34px;padding:14px 20px;display:grid;place-items:center;box-shadow:0 8px 26px #3a2a1a16;border:1px solid var(--line)}
.logo img{width:auto;max-width:100%;height:clamp(90px,17svh,180px);object-fit:contain;display:block}
.rep{grid-area:rep;flex:2 1 auto;min-height:130px;display:flex;align-items:center;gap:18px}
.avatar{height:min(38vw,21svh);width:min(38vw,21svh);min-width:104px;min-height:104px;flex:none;border-radius:8vw;background:var(--tan-l);border:6px solid #fff;box-shadow:0 8px 22px #3a2a1a26;overflow:hidden}
.avatar svg,.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.who{flex:1;min-width:0}
h1{margin:0;font-size:clamp(32px,10.4vw,48px);line-height:1.15;font-weight:800}
.role{margin-top:8px;font-size:clamp(18px,5.4vw,24px);font-weight:700;color:var(--tan);line-height:1.35}
.who hr{border:0;height:2px;background:var(--tan);opacity:.7;margin:14px 0 0}
.actions{grid-area:actions;flex:1.2 1 auto;min-height:104px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.btn{overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border-radius:22px;text-decoration:none;font:800 clamp(15px,4.5vw,19px)/1.2 inherit;font-family:inherit;cursor:pointer;text-align:center;padding:10px 6px;border:2px solid transparent;box-shadow:0 8px 18px #3a2a1a1c}
.btn svg{width:clamp(34px,10vw,46px);height:clamp(34px,10vw,46px)}
.call{background:linear-gradient(160deg,#c49d72,#a47c52);color:#fff}
.wa{background:#fff;color:#1f5fa8;border-color:#2f6db0}
.save{background:#f6ecde;color:var(--tan-d);border-color:var(--tan)}
.about{grid-area:about;flex:1.8 1 auto;min-height:176px;display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:28px;padding:16px 18px;box-shadow:0 6px 20px #3a2a1a12}
.about img{width:clamp(80px,24vw,130px);flex:none;opacity:.28}
.about .t{display:flex;align-items:center;gap:10px;font-weight:800;font-size:clamp(19px,5.4vw,24px)}
.about .t i{width:30px;height:30px;border-radius:50%;background:var(--tan);color:#fff;display:grid;place-items:center;font:700 17px/1 serif;font-style:normal}
.about p{margin:10px 0 0;font-size:clamp(14px,3.9vw,18px);line-height:1.75;border-inline-start:2px solid var(--tan);padding-inline-start:14px}
.bar{grid-area:bar;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#c29b70,#9f7850);color:#fff;border-radius:34px;padding:clamp(12px,2svh,20px) 4px;box-shadow:0 8px 18px #3a2a1a26}
.bar a,.bar>span{display:flex;align-items:center;gap:6px;padding:2px 9px;color:#fff;text-decoration:none;font-weight:700;font-size:clamp(12px,3.4vw,17px);white-space:nowrap}
.bar>*+*{border-inline-start:1px solid #ffffff66}
.bar svg{width:20px;height:20px;flex:none}
.qa{grid-area:lang;justify-self:start;align-self:flex-end;display:flex;gap:8px;direction:ltr}
.qa a,.qa button{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border:1px solid #cfdbe9;background:#fff;border-radius:50%;color:var(--tan);box-shadow:0 2px 8px #3a2a1a14;cursor:pointer;padding:0}
.qa svg{width:22px;height:22px}
@media(max-width:759px){.qa{position:absolute;top:13px;right:14px}.qa a,.qa button{width:42px;height:42px}}
.notfound{display:none;text-align:center;padding:50px 10px}.notfound h2{margin:0 0 8px}.notfound p{margin:0;color:var(--muted)}
html[lang=en] h1{font-size:clamp(28px,8.2vw,44px)}html[lang=en] .role{font-size:clamp(16px,4.6vw,22px)}html[lang=en] .about p{font-size:clamp(13.5px,3.7vw,17px)}
@media(min-width:760px){html[lang=en] h1{font-size:clamp(40px,4.6vw,72px)}html[lang=en] .role{font-size:clamp(20px,2vw,30px)}html[lang=en] .about p{font-size:clamp(16px,1.35vw,21px)}
 .page{display:grid;height:100vh;min-height:620px;padding:28px 5vw 32px;gap:26px 3.5vw;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr auto auto auto;grid-template-areas:"lang lang" "logo rep" "logo actions" "logo about" "bar bar"}
 .logo{padding:3vw;border-radius:44px}.logo img{height:auto;max-height:100%;width:100%}
 .rep{flex-direction:row;gap:2.4vw;align-self:center}
 .avatar{width:clamp(150px,15vw,240px);height:clamp(150px,15vw,240px);border-radius:36px}
